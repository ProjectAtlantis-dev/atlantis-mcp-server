[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlantis-host-adapters"
version = "0.1.0"
requires-python = ">=3.11"
description = "Explicit host identity and integration contracts shared by Atlantis modules"

[tool.setuptools.packages.find]
where = ["python"]
