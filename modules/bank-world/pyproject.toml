[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlantis-economy"
version = "0.1.0"
description = "Shared authenticated Terrain economy gateway to the authoritative bank"
requires-python = ">=3.11"
dependencies = ["atlantis-host-adapters>=0.1,<0.2"]

[tool.setuptools.packages.find]
where = ["python"]
